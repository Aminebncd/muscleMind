framework:
    secret: '%env(APP_SECRET)%'
    handle_all_throwables: true
    http_method_override: false
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    php_errors:
        log: true
    serializer: ~
    validation: { enable_annotations: true }
    translator:
        default_path: '%kernel.project_dir%/translations'
    router:
        utf8: true
